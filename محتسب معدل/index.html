<!DOCTYPE html>

<html dir="rtl" lang="ar">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1" name="viewport" />
  <title>المحتسب الشامل</title>

  <link href="styles.css" rel="stylesheet" />
  <link href="tour.css" rel="stylesheet" />

  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <style>
    .tab-host {
      max-width: 1280px;
      margin-inline: auto;
      padding: 12px
    }

    .iframe-wrap {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
      overflow: hidden
    }

    iframe.calc-frame {
      width: 100%;
      height: calc(205vh - 180px);
      border: 0;
      display: block;
      background: var(--bg)
    }
  </style>
</head>

<body>
  <header class="app-header">
    <div class="brand">
      <div class="logo-circle"></div>
      <div class="brand-text">
        <div class="title">المحتسب الشامل للتمويل الشخصي</div>
      </div>
    </div>
    <button aria-label="تبديل النمط" class="ios-toggle" id="themeToggle">☀️</button>
  </header>
  <nav aria-label="اختيار نوع المحتسب" class="calc-tabs" role="tablist">
    <button aria-selected="true" class="tab-btn active" id="tabPersonal" role="tab">التمويل الشخصي</button>
    <button aria-selected="false" class="tab-btn" id="tabFincPln" role="tab">شركات التمويل</button>
  </nav>
  <div class="tab-host">
    <div class="iframe-wrap">
      <div class="calc-frame" id="calcContainer" role="main"></div>
    </div>
  </div>
  <script>
    (function () {
      const container = document.getElementById('calcContainer');
      const tabs = { tabPersonal: 'personal.html', tabFincPln: 'FincPln.html' };

      function removeInjectedScripts() {
        document.querySelectorAll('script[data-injected="true"]').forEach(s => s.remove());
      }

      async function loadAndInject(url) {
        // cleanup previous
        container.innerHTML = '';
        removeInjectedScripts();
        try {
          const res = await fetch(url, { cache: 'no-store' });
          if (!res.ok) throw new Error('fetch-failed');
          const text = await res.text();
          const parser = new DOMParser();
          const doc = parser.parseFromString(text, 'text/html');
          container.innerHTML = doc.body.innerHTML || '';
          const scripts = Array.from(doc.querySelectorAll('script'));
          for (const s of scripts) {
            if (s.src) {
              // Instead of appending a global script tag (which causes duplicate top-level
              // declarations like `const employee` to throw), fetch the external script
              // and execute it in a function scope. If fetch fails, fall back to adding
              // a script tag.
              const already = document.querySelector('script[src="' + s.src + '"]');
              if (already) continue;
              try {
                const base = (new URL(url, location.href)).href;
                const scriptUrl = (new URL(s.src, base)).href;
                const resp = await fetch(scriptUrl, { cache: 'no-store' });
                if (!resp.ok) throw new Error('fetch-failed-' + resp.status);
                const text = await resp.text();
                try {
                  new Function(text + "\n//# sourceURL=" + scriptUrl).call(window);
                } catch (err) {
                  console.error('Injected external script error from', scriptUrl, err && err.stack ? err.stack : err);
                }
                const marker = document.createElement('script'); marker.setAttribute('data-injected', 'true'); document.body.appendChild(marker);
              } catch (err) {
                // fallback: append script tag (older behavior)
                const nx = document.createElement('script');
                nx.src = s.src; nx.async = false; nx.setAttribute('data-injected', 'true');
                document.body.appendChild(nx);
                await new Promise(r => { nx.onload = nx.onerror = r; });
              }
            } else {
              // execute inline script content safely and report errors without stopping the loader
              try {
                const srcInfo = (doc && doc.location && doc.location.href) ? doc.location.href : url;
                new Function(s.textContent + "\n//# sourceURL=" + srcInfo).call(window);
              } catch (err) {
                console.error('Injected inline script error from', url, err && err.stack ? err.stack : err);
              }
              // still append a marker script so cleanup can remove it later
              const nx = document.createElement('script');
              nx.setAttribute('data-injected', 'true');
              document.body.appendChild(nx);
            }
          }
          // allow injected scripts a brief moment to initialize, then call common init functions if present
          await new Promise(r => setTimeout(r, 150));
          try {
            if (typeof window.updateOptions === 'function') window.updateOptions();
            if (typeof window.updateSum === 'function') window.updateSum();
            if (typeof window.updateImpactChips === 'function') window.updateImpactChips();
            if (typeof window.updateBadges === 'function') window.updateBadges();
          } catch (err) { console.error('post-inject init error', err); }
        } catch (e) {
          // fallback to iframe when fetch fails (e.g., file://)
          container.innerHTML = '';
          const ifr = document.createElement('iframe');
          ifr.className = 'calc-frame';
          ifr.src = url; ifr.setAttribute('loading', 'eager');
          ifr.style.width = '100%'; ifr.style.height = 'calc(208vh - 180px)'; ifr.style.border = '0';
          container.appendChild(ifr);
        }
      }

      function activate(id) {
        Object.keys(tabs).forEach(function (k) {
          var b = document.getElementById(k);
          var on = (k === id);
          b.classList.toggle('active', on);
          b.setAttribute('aria-selected', on ? 'true' : 'false');
        });
        loadAndInject(tabs[id]);
        var theme = document.body.getAttribute('data-theme') || '';
        try { localStorage.setItem('theme', theme); } catch (e) { }
      }
      Object.keys(tabs).forEach(function (k) { document.getElementById(k).addEventListener('click', function () { activate(k); }); });
      var toggle = document.getElementById('themeToggle');
      function applyTheme(t) { document.body.setAttribute('data-theme', t); try { localStorage.setItem('theme', t); } catch (e) { }; toggle.textContent = (t === 'dark' ? '🌙' : '☀️'); }
      var initial = localStorage.getItem('theme') || ''; if (initial) { applyTheme(initial); }
      toggle.addEventListener('click', function () { var cur = (document.body.getAttribute('data-theme') === 'dark') ? '' : 'dark'; applyTheme(cur); });
      // load initial tab
      activate('tabPersonal');
    })();
  </script>

  <footer>جميع الحقوق محفوظة 2026©</footer>
</body>

</html>
